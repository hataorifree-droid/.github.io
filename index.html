<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ガーデニングツール — 小さなWebツール置き場">
  <title>ガーデニングツール</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --soil: #3d4a32;
      --leaf: #5d7a4a;
      --leaf-deep: #3e5c34;
      --cream: #f4efe4;
      --cream-2: #e8efdc;
      --card: #fffdf8;
      --ink: #2c3328;
      --muted: #6b7464;
    }

    body {
      min-height: 100vh;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 10% -10%, #dce8c8 0%, transparent 55%),
        radial-gradient(700px 420px at 110% 20%, #cfe0b8 0%, transparent 50%),
        linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 280px;
      height: 280px;
      left: -80px;
      bottom: -60px;
      background: radial-gradient(circle at 40% 40%, #8aa56a 0%, #6b8a52 42%, transparent 68%);
      opacity: 0.35;
    }

    body::after {
      width: 180px;
      height: 180px;
      right: -40px;
      bottom: 80px;
      background: radial-gradient(circle at 50% 50%, #a3c07c 0%, transparent 70%);
      opacity: 0.4;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      text-align: center;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
      color: var(--soil);
      margin-bottom: 12px;
    }

    .lead {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 40px;
    }

    nav {
      display: grid;
      gap: 14px;
    }

    nav a {
      display: block;
      background: var(--card);
      color: var(--leaf-deep);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding: 18px 24px;
      border-radius: 14px;
      border: 1px solid rgba(61, 74, 50, 0.12);
      box-shadow: 0 8px 24px rgba(61, 74, 50, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: #f7fbf0;
      box-shadow: 0 12px 28px rgba(61, 74, 50, 0.12);
    }

    nav a:active {
      transform: translateY(0);
    }

    @media (min-width: 640px) {
      nav {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>ガーデニングツール</h1>
    <p class="lead">小さなWebツール置き場。これから増えるかもしれません。</p>
    <nav>
      <a href="scale/">スケールわかる君</a>
      <a href="tab/">tab譜つくる君</a>
      <a href="pdf/">PDFくっつけ君</a>
      <a href="img/">画像変える君</a>
    </nav>
  </main>
</body>

</html>
